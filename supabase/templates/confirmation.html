<!doctype html>
<html lang="tr">
  <body style="margin:0;padding:0;background:#faf8f5;font-family:Arial,Helvetica,sans-serif;color:#121c2d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf8f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e9e3d8;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="background:#121c2d;padding:20px 24px;color:#ffffff;font-size:16px;font-weight:bold;">
                Araç Servis Geçmişi
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 8px 24px;">
                <h1 style="margin:0 0 12px 0;font-size:22px;">E-posta adresini doğrula</h1>
                <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#3a4a64;">
                  Hesabını kullanmaya başlamak için aşağıdaki butona dokunarak
                  <strong>{{ .Email }}</strong> adresinin sana ait olduğunu doğrula.
                </p>
                <p style="margin:0 0 24px 0;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                     style="display:inline-block;background:#d9a948;color:#0b1220;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 24px;border-radius:12px;">
                    E-posta adresimi doğrula
                  </a>
                </p>
                <p style="margin:0 0 8px 0;font-size:13px;line-height:1.6;color:#4d5f7c;">
                  Bağlantı 1 saat geçerlidir. Bu hesabı sen oluşturmadıysan bu e-postayı yok sayabilirsin.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
